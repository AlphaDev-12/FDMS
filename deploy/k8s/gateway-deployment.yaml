apiVersion: apps/v1
kind: Deployment
metadata:
  name: fdms-gateway-api
  namespace: fdms-production
  labels:
    app.kubernetes.io/name: fdms-gateway-api
    app.kubernetes.io/part-of: fdms-ecosystem
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fdms-gateway-api
  template:
    metadata:
      labels:
        app: fdms-gateway-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: gateway-api
          image: ghcr.io/chirandu-fdms/fdms-gateway-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5045
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: MultiTenancy__Mode
              value: "MultiTenant"
            - name: DatabaseOptions__Provider
              value: "SqlServer"
            - name: ConnectionStrings__FdmsDatabase
              valueFrom:
                secretKeyRef:
                  name: fdms-secrets
                  key: database-connection-string
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5045
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5045
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
