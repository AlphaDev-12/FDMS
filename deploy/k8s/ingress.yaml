apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fdms-gateway-ingress
  namespace: fdms-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - fdms.chirandu.co.zw
        - api.fdms.co.zw
      secretName: fdms-gateway-tls
  rules:
    - host: fdms.chirandu.co.zw
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fdms-gateway-service
                port:
                  number: 5045
    - host: api.fdms.co.zw
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fdms-gateway-service
                port:
                  number: 5045
