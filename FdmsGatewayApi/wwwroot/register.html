<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Registration - Users Portal</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #090d16;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .register-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #818cf8;
            font-size: 26px;
            margin: 0 auto 15px auto;
        }
        .partner-name {
            font-size: 13px;
            font-weight: 700;
            color: #818cf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .register-title {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 6px 0;
            color: #f8fafc;
        }
        .register-sub {
            font-size: 13px;
            color: #94a3b8;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }
        .btn-register:hover {
            opacity: 0.92;
        }
        .response-box {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
        }
        .response-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }
        .response-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #86efac;
        }
        .footer-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #94a3b8;
        }
        .footer-link a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
        }
        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="register-header">
            <div class="logo-icon" id="register-logo-icon-box">
                <img id="register-logo-img" src="" alt="Partner Logo" style="max-height: 50px; max-width: 160px; object-fit: contain; display: none;" onerror="this.style.display='none'; document.getElementById('register-logo-fallback-icon').style.display='inline-block';">
                <i id="register-logo-fallback-icon" class="fa-solid fa-user-plus"></i>
            </div>
            <div class="partner-name" id="partner-branding-name">Partner Users Portal</div>
            <h1 class="register-title">Account Registration</h1>
            <p class="register-sub">Enter your assigned Tenant API Key to register your user account</p>
        </div>

        <div id="response-box" class="response-box"></div>

        <form id="public-register-form">
            <div class="form-group">
                <label class="form-label" for="reg-apikey"><i class="fa-solid fa-key"></i> Tenant API Key *</label>
                <input type="text" id="reg-apikey" class="form-input" placeholder="e.g. css_tenant_prod_..." required style="font-family: 'JetBrains Mono', monospace; font-size: 13px;">
            </div>

            <div class="form-group">
                <label class="form-label" for="reg-email"><i class="fa-solid fa-envelope"></i> Email Address *</label>
                <input type="email" id="reg-email" class="form-input" placeholder="e.g. name@company.co.zw" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="reg-fullname"><i class="fa-solid fa-user"></i> Full Name</label>
                <input type="text" id="reg-fullname" class="form-input" placeholder="e.g. Jane Doe">
            </div>

            <div class="form-group">
                <label class="form-label" for="reg-password"><i class="fa-solid fa-lock"></i> Password *</label>
                <input type="password" id="reg-password" class="form-input" placeholder="Minimum 6 characters" minlength="6" required>
            </div>

            <button type="submit" class="btn-register" id="btn-submit">
                <i class="fa-solid fa-user-plus"></i> Register & Access Portal
            </button>
        </form>

        <div class="footer-link">
            Already have an account? <a href="index.html">Sign In</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Load partner branding if available
            try {
                const res = await fetch('/api/v1/branding');
                if (res.ok) {
                    const data = await res.json();
                    if (data.companyName) {
                        document.getElementById('partner-branding-name').textContent = data.companyName;
                    }
                    if (data.hasCustomLogo && data.logoUrl) {
                        const img = document.getElementById('register-logo-img');
                        const icon = document.getElementById('register-logo-fallback-icon');
                        if (img) {
                            img.src = data.logoUrl;
                            img.style.display = 'block';
                        }
                        if (icon) {
                            icon.style.display = 'none';
                        }
                    }
                }
            } catch (e) {
                console.error('Failed to fetch branding:', e);
            }

            document.getElementById('public-register-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btn-submit');
                const resp = document.getElementById('response-box');

                const apiKey = document.getElementById('reg-apikey').value.trim();
                const email = document.getElementById('reg-email').value.trim();
                const fullName = document.getElementById('reg-fullname').value.trim();
                const password = document.getElementById('reg-password').value.trim();

                btn.disabled = true;
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Registering Account...`;
                resp.style.display = 'none';

                try {
                    const res = await fetch('/api/v1/tenant/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tenantApiKey: apiKey, email, fullName, password })
                    });

                    const data = await res.json();
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-user-plus"></i> Register & Access Portal`;

                    if (res.ok && data.success) {
                        resp.className = 'response-box response-success';
                        resp.textContent = data.message || 'Registration successful! Redirecting to portal...';
                        resp.style.display = 'block';

                        if (data.token) {
                            sessionStorage.setItem('fdms_dashboard_session', data.token);
                        }

                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1200);
                    } else {
                        resp.className = 'response-box response-error';
                        resp.textContent = data.message || 'Registration failed. Please verify your Tenant API Key.';
                        resp.style.display = 'block';
                    }
                } catch (err) {
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-user-plus"></i> Register & Access Portal`;
                    resp.className = 'response-box response-error';
                    resp.textContent = 'Connection error. Please try again.';
                    resp.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
